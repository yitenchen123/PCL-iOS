name: PCL-iOS Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL-iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Setup xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      
      - name: Cache Java JRE
        id: cache-jre
        uses: actions/cache@v4
        with:
          path: depends/java-*-openjdk
          key: jre-ios-${{ hashFiles('Makefile') }}
      
      - name: Download Java JRE (via Makefile)
        if: steps.cache-jre.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          echo "=== 下载Java JRE for iOS arm64 (参考Amethyst) ==="
          make jre || echo "WARNING: JRE download may have issues, continuing..."
      
      - name: Check Dependencies
        run: make check
      
      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la PCL-iOS.xcodeproj
      
      - name: Build App
        run: |
          xcodebuild -project PCL-iOS.xcodeproj \
            -scheme PCL-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log | tail -50
          if grep -q "BUILD FAILED" /tmp/build.log; then
            echo "=== BUILD FAILED ==="
            grep "error:" /tmp/build.log | head -20
            exit 1
          fi
      
      - name: Package IPA (with JRE bundled)
        run: |
          mkdir -p artifacts/Payload
          if [ -d "build/Build/Products/Debug-iphoneos/PCL-iOS.app" ]; then
            cp -r build/Build/Products/Debug-iphoneos/PCL-iOS.app artifacts/Payload/
          else
            echo "ERROR: Build product not found"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          # 内置JRE (参考Amethyst payload目标)
          if [ -d "depends/java-8-openjdk" ]; then
            mkdir -p artifacts/Payload/PCL-iOS.app/java_runtimes
            cp -r depends/java-*-openjdk artifacts/Payload/PCL-iOS.app/java_runtimes/ 2>/dev/null || true
          fi
          cd artifacts
          zip -r ../PCL-iOS.ipa Payload
          cd ..
          ls -lh PCL-iOS.ipa
          echo "=== IPA内容 ==="
          unzip -l PCL-iOS.ipa | head -30
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCL-iOS.ipa
          path: PCL-iOS.ipa
          if-no-files-found: error
          retention-days: 7
