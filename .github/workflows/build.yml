name: PCL-iOS Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL-iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Check Dependencies
        run: make check
      
      - name: Generate Xcode Project
        run: |
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
          else
            echo "xcodegen not installed, skipping project generation"
          fi
      
      - name: Build Frameworks
        run: |
          echo "=== Building native dylibs ==="
          mkdir -p depends/Frameworks
          # In a real CI, CMake cross-compilation would happen here
          # For now, this is a placeholder for the native build step
      
      - name: Verify Makefile Targets
        run: |
          make help
          make check
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcl-ios-build
          path: |
            depends/
            artifacts/
          if-no-files-found: ignore
