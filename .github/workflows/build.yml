name: PCL-iOS Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL-iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Setup xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      
      - name: Cache Java JRE
        id: cache-jre
        uses: actions/cache@v4
        with:
          path: |
            depends/java-*-openjdk
            depends/jre*.zip
            depends/jre*.tar.xz
          key: jre-ios-${{ hashFiles('Makefile') }}
      
      - name: Download Java JRE (via Makefile)
        timeout-minutes: 20
        run: |
          echo "=== 下载Java JRE for iOS arm64 (来源: assets.angelauramc.dev) ==="
          make jre || echo "WARNING: JRE download may have issues, continuing..."
        
      - name: Verify JRE Installation
        run: |
          echo "=== 验证JRE安装 ==="
          for jdir in depends/java-8-openjdk depends/java-17-openjdk depends/java-21-openjdk depends/java-25-openjdk; do
            if [ -f "$jdir/release" ]; then
              echo "✓ $jdir 已安装"
            else
              echo "✗ $jdir 缺失，重新下载..."
              make jre
              break
            fi
          done
      
      - name: Check Dependencies
        run: make check
      
      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la PCL-iOS.xcodeproj
      
      - name: Build App
        run: |
          xcodebuild -project PCL-iOS.xcodeproj \
            -scheme PCL-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log | tail -50
          if grep -q "BUILD FAILED" /tmp/build.log; then
            echo "=== BUILD FAILED ==="
            grep "error:" /tmp/build.log | head -20
            exit 1
          fi
      
      - name: Package IPA (with JRE bundled)
        run: |
          mkdir -p artifacts/Payload
          if [ -d "build/Build/Products/Debug-iphoneos/PCL-iOS.app" ]; then
            cp -r build/Build/Products/Debug-iphoneos/PCL-iOS.app artifacts/Payload/
          else
            echo "ERROR: Build product not found"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          # 内置JRE (压缩为zip，运行时解压到Documents，避免ldid签名JRE二进制文件导致安装失败)
          if [ -d "depends/java-8-openjdk" ]; then
            echo "=== 打包JRE为zip压缩包 ==="
            cd depends
            zip -r -9 ../artifacts/Payload/PCL-iOS.app/java_runtimes.zip java-*-openjdk
            cd ..
            echo "JRE压缩包大小:"
            ls -lh artifacts/Payload/PCL-iOS.app/java_runtimes.zip
          fi
          cd artifacts
          zip -r ../PCL-iOS.ipa Payload
          cd ..
          ls -lh PCL-iOS.ipa
          echo "=== IPA内容 ==="
          unzip -l PCL-iOS.ipa | head -40
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCL-iOS.ipa
          path: PCL-iOS.ipa
          if-no-files-found: error
          retention-days: 7
