name: Build PCL-iOS

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build PCL-iOS
        run: |
          xcodebuild \
            -project PCL-iOS.xcodeproj \
            -scheme PCL-iOS \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Check app icons
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "PCL-iOS.app" | head -1)
          echo "$APP"
          find "$APP" -maxdepth 1 -iname "*icon*" -print
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/PCL-iOS.app Payload/
          zip -r com.pcl-ios.pcl--ios.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: com.pcl-ios.pcl--ios.zip
          path: com.pcl-ios.pcl--ios.ipa
          if-no-files-found: error
