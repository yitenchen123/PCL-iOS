name: PCL-iOS Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL-iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Setup xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
      
      - name: Download Java JRE (via Makefile)
        run: |
          echo "=== 下载Java JRE for iOS arm64 (参考Amethyst) ==="
          make jre
      
      - name: Check Dependencies
        run: make check
      
      - name: Generate Xcode Project
        run: xcodegen generate
      
      - name: Build App
        run: |
          xcodebuild -project PCL-iOS.xcodeproj \
            -scheme PCL-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build
      
      - name: Package IPA (with JRE bundled)
        run: |
          mkdir -p artifacts/Payload
          cp -r build/Build/Products/Debug-iphoneos/PCL-iOS.app artifacts/Payload/
          # 内置JRE (参考Amethyst payload目标)
          mkdir -p artifacts/Payload/PCL-iOS.app/java_runtimes
          cp -r depends/java-*-openjdk artifacts/Payload/PCL-iOS.app/java_runtimes/
          cd artifacts
          zip -r ../PCL-iOS.ipa Payload
          cd ..
          ls -lh PCL-iOS.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCL-iOS.ipa
          path: PCL-iOS.ipa
          if-no-files-found: error
